name: cv_builder
description: "A modern Flutter application for creating professional CVs with an integrated AI Career Agent."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.2
  uuid: ^4.5.1
  intl: ^0.19.0
  http: ^1.2.2
  file_picker: ^12.2.0
  syncfusion_flutter_pdf: ^34.2.7
  archive: ^4.0.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
